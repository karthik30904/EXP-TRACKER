[project]
name = "exp-tracker-backend"
version = "0.1.0"
description = "Expense Tracker REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "pyjwt>=2.9.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.0.0",
]

[tool.uv]
package = false
